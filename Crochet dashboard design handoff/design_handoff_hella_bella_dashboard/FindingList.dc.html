<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:10px;">
  <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
    <div
      onClick="{{ item.toggle }}"
      style="{{ item.rowStyle }}"
      style-hover="background:oklch(0.26 0.035 293); box-shadow:0 8px 22px oklch(0.05 0 0 / 0.35), inset 0 1px 0 oklch(0.88 0.03 250 / 0.12);"
    >
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px;">
        <div style="flex:1; font-family:'Manrope',sans-serif; font-size:15px; line-height:1.55; color:oklch(0.94 0.015 85);">{{ item.finding }}</div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0; margin-top:2px;">
          <span style="{{ item.dotStyle }}"></span>
          <span style="font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:{{ item.confColor }}; white-space:nowrap;">{{ item.confidence }}</span>
          <span style="{{ item.chevronStyle }}"></span>
        </div>
      </div>
      <sc-if value="{{ item.isExpanded }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid oklch(0.34 0.045 290 / 0.4); font-family:'Manrope',sans-serif; font-size:12.5px; color:oklch(0.65 0.025 280);">
          <span style="text-transform:uppercase; letter-spacing:0.05em; font-weight:700; color:oklch(0.5 0.02 280); margin-right:6px;">Source</span>{{ item.source }}
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:400},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Array&lt;{finding:string,confidence:string,source:string}&gt;&quot;}}">
class Component extends DCLogic {
  state = { expanded: {} };

  toggle(i) {
    this.setState((s) => ({ expanded: { ...s.expanded, [i]: !s.expanded[i] } }));
  }

  confMeta(level) {
    const lower = (level || '').toLowerCase();
    if (lower.startsWith('high')) return { color: 'oklch(0.65 0.09 200)' };
    if (lower.startsWith('medium')) return { color: 'oklch(0.75 0.12 70)' };
    if (lower.startsWith('low')) return { color: 'oklch(0.62 0.12 15)' };
    return { color: 'oklch(0.55 0.02 280)' };
  }

  renderVals() {
    const raw = this.props.items || [];
    const expanded = this.state.expanded;
    const items = raw.map((it, i) => {
      const meta = this.confMeta(it.confidence);
      const isExpanded = !!expanded[i];
      return {
        finding: it.finding,
        source: it.source,
        confidence: it.confidence,
        confColor: meta.color,
        isExpanded,
        toggle: () => this.toggle(i),
        rowStyle: `background:oklch(0.28 0.035 293); border-left:3px solid ${meta.color}; border-radius:2px 8px 8px 2px; padding:13px 16px; cursor:pointer; box-shadow:inset 0 1px 0 oklch(0.88 0.03 250 / 0.08); transition:background 0.15s ease, box-shadow 0.15s ease;`,
        dotStyle: `width:7px; height:7px; border-radius:50%; background:${meta.color}; box-shadow:0 0 6px ${meta.color};`,
        chevronStyle: `width:6px; height:6px; border-right:1.5px solid oklch(0.5 0.02 280); border-bottom:1.5px solid oklch(0.5 0.02 280); transform:rotate(${isExpanded ? '225deg' : '-45deg'}); transition:transform 0.15s ease; margin-left:2px;`,
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
